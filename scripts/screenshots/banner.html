<!doctype html>
<!-- The README banner and GitHub social preview (1280×640). Rendered by shoot.mjs after the screenshots. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>YT Downloader banner</title>
<style>
  :root { --accent: #d93a32; --text: #f4f4f1; --muted: #a9a9a2; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 520px at 88% 30%, rgba(217, 58, 50, .34), transparent 62%),
      radial-gradient(700px 420px at 10% 110%, rgba(217, 58, 50, .16), transparent 60%),
      linear-gradient(160deg, #1b1a19 0%, #111110 55%, #0c0c0b 100%);
  }
  /* a faint grid, so the dark doesn't read as empty */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(800px 500px at 30% 50%, #000 30%, transparent 80%);
  }
  .copy { position: absolute; left: 72px; top: 92px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; }
  .logo {
    width: 68px; height: 68px; border-radius: 19px; background: var(--accent); display: grid; place-items: center;
    box-shadow: 0 12px 34px rgba(217, 58, 50, .45), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .logo svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  h1 { font-size: 54px; line-height: 1.04; font-weight: 800; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: #ff6a5f; }
  p.lead { margin-top: 22px; font-size: 21px; line-height: 1.45; color: var(--muted); max-width: 470px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; max-width: 500px; }
  .chip {
    font-size: 15px; font-weight: 600; padding: 8px 14px; border-radius: 999px; color: #e9e9e4;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  }
  .chip b { color: #ff6a5f; font-weight: 700; margin-right: 6px; }

  /* the app, in a window running off the right edge (flat: a tilt blurs the small text) */
  .shot {
    position: absolute; left: 650px; top: 96px; width: 700px; height: 600px;
    border-radius: 14px 0 0 0; overflow: hidden; background: #f6f6f4;
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 40px 100px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
  }
  .bar { height: 34px; background: #e9e9e5; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #d6d6d0; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar span { margin-left: 14px; font-size: 12px; color: #77776f; background: #f6f6f4; padding: 3px 12px; border-radius: 6px; }
  /* the screenshot (1440 px wide page at 2×) at 0.82 scale, from the page's left content edge, down to Activity */
  .view { position: relative; height: calc(100% - 34px); overflow: hidden; }
  .view img { position: absolute; width: 1181px; left: -186px; top: -276px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 5v10m0 0-4-4m4 4 4-4M7 19h10"/></svg></div>
      <div class="name">YT Downloader</div>
    </div>
    <h1>Whole playlists.<br>Every file <em>verified</em>.</h1>
    <p class="lead">A local YouTube downloader for playlists and channels that keeps going on a weak connection and never counts a broken file as done.</p>
    <div class="chips">
      <span class="chip"><b>↻</b>Resumes after any drop</span>
      <span class="chip"><b>✓</b>Checks every file</span>
      <span class="chip"><b>≡</b>Playlists &amp; channels</span>
      <span class="chip"><b>⌂</b>Runs on your computer</span>
    </div>
  </div>
  <div class="shot">
    <div class="bar"><i></i><i></i><i></i><span>127.0.0.1:8765</span></div>
    <div class="view"><img src="../../docs/images/overview.png" alt=""></div>
  </div>
</body>
</html>
